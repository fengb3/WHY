name: Release WHY.Cli (Native AOT binaries)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: why-win-x64.tar.gz
          - rid: linux-x64
            os: ubuntu-latest
            archive: why-linux-x64.tar.gz
          - rid: linux-musl-x64
            os: ubuntu-latest
            archive: why-linux-musl-x64.tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: why-osx-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Publish native binary
        shell: bash
        run: >
          dotnet publish WHY.Cli/WHY.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          /p:Version=${{ steps.version.outputs.version || '0.1.0' }}
          -o ./publish

      - name: Archive binary
        shell: bash
        run: tar -czf ${{ matrix.archive }} -C ./publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: why-*.tar.gz
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.tar.gz
          generate_release_notes: true
