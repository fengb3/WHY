name: Deploy Server (Full CI)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /app/why

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # GHCR 要求镜像仓库名全小写（github.repository 是 fengb3/WHY，含大写）
    - name: Set lowercase image prefix
      run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Aspire CLI
      run: |
        curl -sSL https://aspire.dev/install.sh | bash
        echo "$HOME/.aspire/bin" >> $GITHUB_PATH

    # 1. 通过 Aspire 生成 Docker Compose 文件（AppHost 是唯一的编排事实来源）
    #    WHY.Web 被 ExcludeFromManifest 排除（部署到 GitHub Pages），
    #    compose 中只包含 postgres + why-api + caddy (+ dashboard)
    - name: Generate Docker Compose via Aspire
      env:
        Parameters__apidomain: ${{ secrets.API_DOMAIN }}
      run: aspire publish --apphost WHY.AppHost/WHY.AppHost.csproj -o output --non-interactive

    # 2. 登录镜像仓库
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. 构建并推送 API 镜像（Web 是静态站点走 GitHub Pages，无需镜像）
    - name: Build & Push API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: WHY.Api/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/why-api:sha-${{ github.sha }}

    # 4. 准备部署脚本和变量
    #    CADDY_BINDMOUNT_0 指向 Caddyfile（相对 compose 文件目录），随 scp 一起上传
    #    CADDY_BINDMOUNT_1 指向 certs 目录（由服务器上的 acme.sh 生成，不在 CI 中管理）
    - name: Prepare Deploy Scripts
      run: |
        cat <<EOF > output/.env.production
        # 数据库密码
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

        # API 容器端口（Caddy 反代到 why-api:8080，与 deploy/Caddyfile 保持一致）
        WHY_API_PORT=8080

        # API 镜像引用 (使用刚才构建的标签)
        WHY_API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/why-api:sha-${{ github.sha }}

        # API 的公网域名（如 why-api.duckdns.org）
        APIDOMAIN=${{ secrets.API_DOMAIN }}

        # Caddyfile 的挂载路径（相对 docker-compose.yaml 所在目录）
        CADDY_BINDMOUNT_0=./Caddyfile

        # TLS 证书目录（由服务器上的 acme.sh 通过 deploy/setup-server.sh 生成）
        CADDY_BINDMOUNT_1=./certs
        EOF

    # 5. 复制文件到服务器
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "output/docker-compose.yaml,output/.env.production,deploy/Caddyfile"
        target: ${{ env.DEPLOY_PATH }}
        strip_components: 1 # 去掉 output/ 和 deploy/

    # 6. 在服务器上执行部署
    - name: Deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ${{ env.DEPLOY_PATH }}

          # 登录到 ghcr.io
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # 重命名环境文件以供 docker compose 使用
          mv .env.production .env

          # 拉取镜像并启动
          docker compose pull
          docker compose up -d --remove-orphans
